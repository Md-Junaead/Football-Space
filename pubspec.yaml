name: football_space
description: "Football Live Score — live matches, leagues & match details."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # ── State management (Cubit/Bloc — used by Home & MatchDetail) ──
  flutter_bloc: ^9.1.1

  # ── Networking (used by HomeCubit & MatchDetailCubit for the API) ──
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/icon/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#0a0a0a"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  min_sdk_android: 21

  # dart run flutter_launcher_icons